[package]
name = "bzx"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bzip2 = "0.6.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
crc32fast = "1.5.3"
dunce = "1.0.5"
eframe = "0.37.0"
encoding_rs = "0.8.42"
flate2 = { version = "1.1.10", features = ["zlib-rs"] }
lzma-rust2 = "0.24.0"
rfd = "0.17.2"
sevenz-rust2 = { version = "0.24.1", default-features = false, features = ["bzip2", "ppmd", "deflate", "zstd", "util"] }
tar = "0.4.46"
walkdir = "2.5.0"
zip = { version = "9.1.2", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64", "bzip2", "lzma", "xz", "zstd", "ppmd"] }
zstd = { version = "0.14.3", features = ["zstdmt"] }

[dev-dependencies]
sevenz-rust2 = { version = "0.24.1", default-features = false, features = ["compress", "util", "bzip2", "ppmd", "deflate", "zstd"] }
tempfile = "3.27.0"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[build-dependencies]
winresource = "0.1.34"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_Shell"] }
winreg = "0.56.0"
